version: "2"
formatters:
  settings:
    gofumpt:
      extra:
        group-params: true
  enable:
    - gofumpt
    - goimports
linters:
  settings:
    gocritic:
      disabled-checks:
        - unlambda
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    #- containedctx
    #- contextcheck
    #- cyclop
    - decorder
    #- depguard
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    # - execinquery
    - exhaustive
    #- exhaustruct
    # - forbidigo
    - forcetypeassert
    #- funlen
    #- gci
    - ginkgolinter
    - gocheckcompilerdirectives
    #- gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    #- gocognit
    #- goconst
    - gocritic
    #- gocyclo
    - godot
    #- godox
    #- goerr113
    #- gofmt
    - goheader
    #- gomnd
    #- gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    #- gosimple  # merged into staticcheck in v2
    - gosmopolitan
    - govet
    - grouper
    - importas
    #- inamedparam
    #- interfacebloat
    #- ireturn
    #- lll
    - loggercheck
    #- maintidx
    - makezero
    - mirror
    - misspell
    #- musttag
    - nakedret
    #- nestif
    - nilerr
    #- nilnil
    #- nlreturn
    - noctx
    #- nolintlint
    #- nonamedreturns
    - nosprintfhostport
    #- paralleltest
    #- perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - revive
    #- rowserrcheck
    - sloglint
    #- sqlclosecheck
    - staticcheck
    #- stylecheck  # merged into staticcheck in v2
    - tagalign
    #- tagliatelle
    #- tenv  # removed in v2
    - testableexamples
    # - testifylint
    #- testpackage
    #- thelper
    - tparallel
    #- unconvert
    - unparam
    - unused
    - usestdlibvars
    #- varnamelen
    #- wastedassign
    - whitespace
    #- wrapcheck
    #- wsl
    - zerologlint
